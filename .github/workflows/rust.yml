name: Rust

on:
  push:
    branches: [ "master", "su2-3d", "transition-legacy-3d" ]
  pull_request:
    branches: [ "master", "su2-3d", "transition-legacy-3d" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

